[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-reference-topk-fidelity"
version = "0.2.0"
description = "Metrics, defenses, and audited query accounting for clean-reference Top-k fidelity"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Anonymous Authors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.scripts]
topk-fidelity = "topk_fidelity.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.8", "build>=1.2"]
experiments = [
  "gdown>=5.0",
  "pillow>=10.0",
  "scipy>=1.11",
  "timm>=1.0",
  "torchvision>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["experiments/frozen"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
