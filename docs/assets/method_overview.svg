<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Clean-reference Top-k fidelity method</title>
  <desc id="desc">A clean input defines a reference Top-k set. Projected strengthening and optional Gaussian noise produce an output whose Top-k set is compared with the clean reference.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}
      .accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
      .out{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}
      .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}
      .label{font:600 18px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#475569;text-anchor:middle}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="330" fill="#ffffff"/>
  <rect class="box" x="35" y="118" width="135" height="90"/>
  <text class="label" x="102" y="153">Clean input</text>
  <text class="small" x="102" y="180">x</text>

  <rect class="accent" x="235" y="35" width="190" height="92"/>
  <text class="label" x="330" y="70">Reference model</text>
  <text class="small" x="330" y="97">Sₖ(x) = set(TopK)</text>

  <rect class="accent" x="235" y="195" width="230" height="100"/>
  <text class="label" x="350" y="228">Projected strengthening</text>
  <text class="small" x="350" y="255">Top-1 + set-boundary margin</text>
  <text class="small" x="350" y="278">‖δ‖∞ ≤ ε</text>

  <rect class="warn" x="535" y="201" width="165" height="88"/>
  <text class="label" x="618" y="235">Gaussian noise</text>
  <text class="small" x="618" y="263">optional, σ ≥ 0</text>

  <rect class="box" x="770" y="201" width="155" height="88"/>
  <text class="label" x="848" y="235">Output model</text>
  <text class="small" x="848" y="263">one API response</text>

  <rect class="out" x="955" y="92" width="140" height="142"/>
  <text class="label" x="1025" y="127">Exact set?</text>
  <text class="small" x="1025" y="157">set(TopK)</text>
  <text class="small" x="1025" y="179">= Sₖ(x)</text>
  <text class="small" x="1025" y="210">average over draws</text>

  <path class="arrow" d="M170 143 C195 130 205 92 235 82"/>
  <path class="arrow" d="M170 183 C195 194 210 226 235 240"/>
  <path class="arrow" d="M330 127 L330 195"/>
  <path class="arrow" d="M465 245 L535 245"/>
  <path class="arrow" d="M700 245 L770 245"/>
  <path class="arrow" d="M925 237 C945 224 947 196 955 184"/>
  <path class="arrow" d="M425 81 C680 63 856 62 955 119"/>
</svg>
