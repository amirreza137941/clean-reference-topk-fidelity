name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install ".[test,dev]"
      - name: Check core style
        run: |
          ruff check .
          ruff format --check .
      - name: Compile source
        run: python -m compileall -q src experiments/frozen tests
      - name: Audit release contents
        run: python scripts/audit_release.py
      - name: Run original/refactor comparisons
        run: pytest -q
      - name: Verify release manifest
        run: sha256sum -c MANIFEST.sha256
      - name: Build package
        run: python -m build
